# Учётная запись для CI (Jenkins): может обновлять развертывания в пространстве tasks и только в нём.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: tasks
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: tasks
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: tasks
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: tasks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
# Долгоживущий токен учётной записи: из него собирается kubeconfig для Jenkins.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: tasks
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
